name: Railvito Android 1.8.0
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['Railvito_1.2.0_Godot_Source.zip', '.github/workflows/android.yml', 'tools/apply_deluxe.py', 'tools/apply_visual_polish.py', 'tools/apply_quality.py', 'tools/apply_touch_redesign.py', 'tools/apply_corner_ui.py', 'tools/apply_petal_ads.py', 'assets/railvito_launcher.webp', 'Railvito_Icon_512.png']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GODOT_VERSION: 4.7.2
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
      GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
    steps:
      - uses: actions/checkout@v4
      - name: Configure temporary signing paths
        run: |
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/railvito-release.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/railvito-debug.keystore" >> "$GITHUB_ENV"
      - name: Unpack source
        run: |
          test -s Railvito_1.2.0_Godot_Source.zip || { echo '::error::Source archive is not present in the repository'; exit 1; } 
          echo 'f0e025d00415b0b5aa4044fc71e9f6ee5066d89abb87f04fb16a4306a89e1c20  Railvito_1.2.0_Godot_Source.zip' | sha256sum -c -
          unzip -q Railvito_1.2.0_Godot_Source.zip -d source
          test -f source/Railvito/project.godot
          python3 tools/apply_deluxe.py
          python3 tools/apply_visual_polish.py
          python3 tools/apply_quality.py
          python3 tools/apply_touch_redesign.py
          python3 tools/apply_corner_ui.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('source/Railvito/scripts/main.gd')
          s=p.read_text()
          old='\t_button(t("close"),Vector2(28,527),Vector2(630,64),func():_save();_close_modal();_game_ui() if screen=="game" else _show_menu() if screen=="menu" else _close_modal(),TEAL,p)'
          assert old in s
          s=s.replace(old,'\t_button(t("privacy"),Vector2(28,475),Vector2(630,46),_privacy,Color("e4ebd8"),p)\n'+old,1)
          old='\t_button(t("close"),Vector2(28,362),Vector2(662,62),_close_modal,TEAL,p)'
          assert old in s
          s=s.replace(old,'\t_button(t("privacy_online"),Vector2(28,305),Vector2(662,49),func():OS.shell_open("https://mhmmad444410aa-ai.github.io/Privacy-Policies/railvito.html"),Color("e4ebd8"),p)\n'+old,1)
          p.write_text(s)
          p=Path('source/Railvito/scripts/strings.gd')
          s=p.read_text().replace('const ADVENTURE_WORDS := {','const ADVENTURE_WORDS := {\n\t"privacy_online": ["Privacy policy website","سياسة الخصوصية على الويب","Política de privacidade online"],',1)
          s=s.replace('This preview works offline.','This game works offline.').replace('تعمل هذه التجربة دون إنترنت.','تعمل هذه اللعبة دون إنترنت.').replace('Esta prévia funciona offline.','Este jogo funciona offline.')
          p.write_text(s)
          PY
          python3 tools/apply_petal_ads.py
          grep -q 'config/version="1.8.0"' source/Railvito/project.godot
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Godot and SDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager" || sdkmanager="$(command -v sdkmanager)"
          "$sdkmanager" "platform-tools" "build-tools;36.0.0" "platforms;android-36"
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fL --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          sudo ln -s "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -fL --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dir" "$HOME/.config/godot" source/Railvito/build
          unzip -j -q "$RUNNER_TEMP/templates.tpz" templates/android_debug.apk templates/android_release.apk templates/android_source.zip templates/version.txt -d "$dir"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_HOME" "$JAVA_HOME" > "$HOME/.config/godot/editor_settings-4.7.tres"
      - name: Configure native ads Gradle template
        run: |
          set -euo pipefail
          dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          python3 tools/apply_petal_ads.py "$dir/android_source.zip" "${GODOT_VERSION}.stable"
          chmod +x source/Railvito/android/build/gradlew
      - name: Verify project and tests
        working-directory: source/Railvito
        run: |
          set -euo pipefail
          godot --headless --editor --import 2>&1 | tee build/import.log
          if grep -E 'SCRIPT ERROR|^ERROR:' build/import.log; then exit 1; fi
          timeout 60 godot --headless -- --self-test 2>&1 | tee build/self-test.log
          grep -E 'RAILVITO_SELF_TEST_OK' build/self-test.log
          for test in engines worlds cab deluxe polish quality rails_ui corner_ui; do
            XDG_DATA_HOME="$RUNNER_TEMP/railvito-$test" timeout 60 godot --headless --script "res://tests/verify_$test.gd" 2>&1 | tee "build/$test.log"
          done
          if grep -E 'SCRIPT ERROR|^ERROR:' build/*.log; then exit 1; fi
          grep -E 'TOAST_LIFETIME_CHECK_OK' build/engines.log
          grep -E 'WORLD_EXPANSION_PASS' build/worlds.log
          grep -E 'CAB_CHECK_OK' build/cab.log
          grep -E 'DELUXE_UI_PASS' build/deluxe.log
          grep -E 'POLISH_PASS' build/polish.log
          grep -E 'QUALITY_PASS' build/quality.log
          grep -E 'RAILS_UI_PASS' build/rails_ui.log
          grep -E 'CORNER_UI_PASS' build/corner_ui.log
          python3 tools/verify_assets.py
      - name: Build test APK
        working-directory: source/Railvito
        run: |
          set -euo pipefail
          keytool -genkeypair -keystore "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Railvito Debug,C=JO"
          godot --headless --export-debug Android build/Railvito-1.8.0-debug.apk 2>&1 | tee build/export-debug.log
          test -s build/Railvito-1.8.0-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose build/Railvito-1.8.0-debug.apk
          unzip -l build/Railvito-1.8.0-debug.apk | grep -E "mipmap|launcher" > build/launcher-resources.txt
          sha256sum build/Railvito-1.8.0-debug.apk > build/debug-sha256.txt
      - name: Build original-key signed release
        if: env.KEYSTORE_BASE64 != ''
        working-directory: source/Railvito
        run: |
          set -euo pipefail
          test -n "$GODOT_ANDROID_KEYSTORE_RELEASE_USER"
          test -n "$GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"
          godot --headless --export-release Android build/Railvito-1.8.0-release.apk 2>&1 | tee build/export-release.log
          test -s build/Railvito-1.8.0-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs build/Railvito-1.8.0-release.apk > build/signature.txt
          grep -qi '733a7d7008d1c10f9144cf289fbaba93ad0b7aecbb7c0c31b84cd1a8ebffee62' build/signature.txt
          sha256sum build/Railvito-1.8.0-release.apk > build/SHA256SUMS.txt
      - name: Export unsigned production APK for offline original-key signing
        if: env.KEYSTORE_BASE64 == ''
        working-directory: source/Railvito
        run: |
          set -euo pipefail
          cp export_presets.cfg "$RUNNER_TEMP/railvito-export-presets.cfg"
          trap 'cp "$RUNNER_TEMP/railvito-export-presets.cfg" export_presets.cfg' EXIT
          sed -i 's/^package\/signed=true$/package\/signed=false/' export_presets.cfg
          # Godot validates release keystore settings even for an unsigned export.
          unset GODOT_ANDROID_KEYSTORE_RELEASE_PATH GODOT_ANDROID_KEYSTORE_RELEASE_USER GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD
          grep -Fxq 'package/signed=false' export_presets.cfg
          godot --headless --export-release Android build/Railvito-1.8.0-unsigned.apk 2>&1 | tee build/export-release.log
          test -s build/Railvito-1.8.0-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 build/Railvito-1.8.0-unsigned.apk || {
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -P 16 -f 4 build/Railvito-1.8.0-unsigned.apk build/Railvito-aligned.apk
            mv build/Railvito-aligned.apk build/Railvito-1.8.0-unsigned.apk
          }
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 build/Railvito-1.8.0-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging build/Railvito-1.8.0-unsigned.apk > build/release-badging.txt
          sha256sum build/Railvito-1.8.0-unsigned.apk > build/unsigned-sha256.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree build/Railvito-1.8.0-unsigned.apk AndroidManifest.xml > build/release-manifest.txt
          grep -q 'org.godotengine.plugin.v2.RailvitoAds' build/release-manifest.txt
          python3 - <<'PY'
          from zipfile import ZipFile
          with ZipFile('build/Railvito-1.8.0-unsigned.apk') as z:
              dex=b''.join(z.read(n) for n in z.namelist() if n.endswith('.dex'))
              for term in (b'v6hj6tigae',b'd58nfmswrt',b'RailvitoAds'):
                  assert term in dex, term
          PY
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" build/apksigner.jar
      - name: Archive verified updated source
        if: success()
        working-directory: source/Railvito
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          with ZipFile('build/Railvito-1.8.0-source.zip', 'w', ZIP_DEFLATED) as z:
              for f in Path('.').rglob('*'):
                  if f.is_file() and not any(x in f.parts for x in ('.godot', 'build', '.git')):
                      z.write(f, 'Railvito/'+f.as_posix())
          PY
      - name: Remove signing keys
        if: always()
        run: rm -f "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH" "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Railvito-Android
          path: |
            source/Railvito/build/*.apk
            source/Railvito/build/*-source.zip
            source/Railvito/build/*.log
            source/Railvito/build/launcher-resources.txt
            source/Railvito/build/debug-sha256.txt
            source/Railvito/build/signature.txt
            source/Railvito/build/apksigner.jar
            source/Railvito/build/release-badging.txt
            source/Railvito/build/release-manifest.txt
            source/Railvito/build/unsigned-sha256.txt
            source/Railvito/build/SHA256SUMS.txt
          if-no-files-found: warn
